name: Weekly data refresh

# Re-pulls every band's data into the checked-in cache and commits it.
# Pushing to main triggers a Vercel redeploy, so production serves fresh data.
# Runs Mondays 08:00 UTC (~3-4am ET) to capture the weekend's shows.

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch: {}        # allow manual runs from the Actions tab

permissions:
  contents: write              # needed to commit + push the refreshed data

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh all band caches
        run: python scripts/refresh_all.py

      - name: Commit and push if data changed
        run: |
          git config user.name  "jammuse-bot"
          git config user.email "actions@github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes — nothing to commit."
          else
            git commit -m "chore: weekly data refresh [skip ci]"
            git push
          fi
